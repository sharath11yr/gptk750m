name: Make video

on:
  workflow_dispatch:
    inputs:
      song_id:
        description: Song id (from the bot)
        required: true
      dry_run:
        description: Only make the video (no upload); download it from this run's artifacts
        type: boolean
        default: false

concurrency:
  group: video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'GetYr_music' }}
      YT_SLOTS: ${{ vars.YT_SLOTS || '18:30' }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the latest state (the bot may have written since this run was queued)
        run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-video.txt
      - name: Install ffmpeg and fonts for every language
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          mkdir -p assets/fonts
          curl -sSfL -o assets/fonts/BebasNeue-Regular.ttf https://github.com/google/fonts/raw/main/ofl/bebasneue/BebasNeue-Regular.ttf
      - name: Install Python packages
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          # openai-whisper's source build still imports pkg_resources (gone from new setuptools)
          pip install "setuptools<70" wheel
          pip install --no-build-isolation "openai-whisper==20240930"
          pip install -r requirements-video.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-small
      - name: Make and upload
        run: python -m video.make "${{ inputs.song_id }}" ${{ inputs.dry_run && '--dry-run' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-${{ inputs.song_id }}
          path: |
            work/video.mp4
            work/thumb.jpg
            work/lyrics.ass
          if-no-files-found: ignore
          retention-days: 7
      - name: Save state
        if: always() && !inputs.dry_run
        run: |
          git config user.name "music-bot"
          git config user.email "music-bot@users.noreply.github.com"
          git add state/uploads.json
          git diff --cached --quiet && exit 0
          git commit -m "Uploaded ${{ inputs.song_id }}"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
      - name: Tell Telegram if it failed
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_USER_ID}" \
            --data-urlencode text="❌ Video failed for ${{ inputs.song_id }}. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} - send /video ${{ inputs.song_id }} to retry after fixing."
